<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팔도유람 | 함피 민병규</title>
  <meta name="description" content="제주, 경상, 전라, 강원, 경기 및 서울 등 전국">
  <link rel="icon" href="favicon.png">

  <!-- 서체 불러오기 (고급스러운 Serif / Sans-serif 조합) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #03c75a;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --nav-bg: #1e293b;
      --nav-hover: #334155;
      --accent-color: #38bdf8;
      --theme-green: #1c3d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 1. 상단 로고 헤더 */
    header { background: #ffffff; padding: 15px 24px; border-bottom: 1px solid #e2e8f0; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .main-logo { height: 130px; width: auto; object-fit: contain; }
    .stamp-logo { height: 110px; width: auto; object-fit: contain; }

    /* 2. 네비게이션 메인 바 */
    nav { background-color: var(--nav-bg); position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .nav-container { max-width: 1200px; margin: 0 auto; }
    .main-menu { display: flex; list-style: none; flex-wrap: wrap; }
    .main-menu > li { position: relative; }
    .main-menu > li > a {
      display: block;
      padding: 16px 20px;
      color: #f8fafc;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.3s, color 0.3s;
    }
    .main-menu > li:hover > a, .main-menu > li.active > a {
      background-color: var(--nav-hover);
      color: var(--accent-color);
    }

   

    /* 3. 지구여행 전용 오버레이 히어로 영역 */
    .travel-hero-container {
      position: relative;
      width: 100%;
      min-height: calc(100vh - 200px);
      /* 고급스러운 포르투갈 해안가 마을 배경 사진 */
      background: url('https://images.unsplash.com/photo-1555881400-74d7acaacd8b?auto=format&fit=crop&w=2000&q=85') center center / cover no-repeat;
      display: flex;
      align-items: center;
    }

    /* 좌측 텍스트 가독성을 위한 화이트 그라데이션 오버레이 */
    .travel-hero-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.78) 45%, rgba(255,255,255,0.1) 80%);
      z-index: 1;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .hero-content-box {
      max-width: 580px;
    }

    /* 제목 스타일 */
    .main-title {
  font-family: 'Pretendard', -apple-system, sans-serif; /* 일반 산세리프 서체 적용 */
  font-size: 36px; /* 56px -> 36px로 축소 (원하시는 크기로 조절 가능) */
  font-weight: 700;
  color: var(--theme-green);
  letter-spacing: -1px;
  line-height: 1.25;
  margin-bottom: 8px;
}

    .sub-title {
  font-family: 'Montserrat', sans-serif; /* Montserrat 서체 적용 */
  font-size: 20px;
  font-weight: 600;
  color: #2c4c3e;
  letter-spacing: 0.5px; /* 자간 축소 (원하시는 느낌에 맞춰 0px~1px 사이로 조절) */
  margin-bottom: 36px;
}

    /* 본문 글 */
    .description-text {
      font-size: 17px;
      color: #2d3748;
      line-height: 1.85;
      word-break: keep-all;
      margin-bottom: 32px;
      font-weight: 400;
    }

    /* 더보기 버튼 */
    .btn-more {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      background-color: var(--theme-green);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 4px;
      transition: background-color 0.25s, transform 0.2s;
      box-shadow: 0 4px 12px rgba(28, 61, 50, 0.2);
    }

    .btn-more:hover {
      background-color: #122821;
      transform: translateY(-2px);
    }

    /* 하단 여행지 태그 */
    .keywords-list {
      margin-top: 24px;
      font-size: 15px;
      color: #4a5568;
      font-weight: 500;
    }

    /* 4. 푸터 */
    footer { background-color: #0f172a; color: #94a3b8; padding: 35px 20px; margin-top: auto; }
    .footer-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }

    /* 반응형 화면 설정 */
    @media (max-width: 768px) {
      .travel-hero-container::before {
        background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.85) 60%, rgba(255,255,255,0.3) 100%);
      }
      .main-title { font-size: 40px; }
      .sub-title { font-size: 16px; letter-spacing: 4px; margin-bottom: 24px; }
      .description-text { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- 상단 로고 헤더 -->
  <header>
    <div class="header-container">
      <a href="index.html"><img src="logo1.png" alt="메인 로고" class="main-logo"></a>
      <a href="index.html"><img src="dojang11.png" alt="도장 로고" class="stamp-logo"></a>
    </div>
  </header>

  <!-- 상단 네비게이션 메뉴 -->
  <nav>
    <div class="nav-container">
      <ul class="main-menu">
      <li>
  <a href="global_travel.html">지구여행</a>
</li>
        <li><a href="domestic.html">팔도유람</a></li>

        <li><a href="https://blog.naver.com/guestbook/GuestBookList.naver?blogId=hampinim" target="_blank">톡톡이야기방</a></li>
        <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&from=postList&categoryNo=23&parentCategoryNo=23" target="_blank">인도엿보기(2008)</a></li>
      </ul>
    </div>
  </nav>

  <!-- 지구여행 오버레이 섹션 -->
  <main class="travel-hero-container">
    <div class="hero-inner">
      <div class="hero-content-box">
        <h1 class="main-title">지구여행</h1>
        <div class="sub-title">DOMESTIC TRAVEL</div>

        <p class="description-text">
          먼 나라보다 가까운 우리 땅이 때로 더 낯설고 아름답다.<br>
          제주의 바람, 경주의 고즈넉함, 강원의 설경까지<br>
          팔도 구석구석을 걸으며 담은<br> 
          대한민국 여행기.
        </p>

        <div>
          <a href="https://blog.naver.com/PostList.naver?blogId=hampinim&from=postList&categoryNo=21" target="_blank" class="btn-more">
            더보기 &rarr;
          </a>
        </div>

        <div class="keywords-list">
          제주, 경상, 전라, 강원, 경기 및 서울 등 전국
        </div>
      </div>
    </div>
  </main>

  <!-- 하단 푸터 -->
  <footer>
    <div class="footer-container">
      <div class="footer-info">
        <p>© KoreaHostel All rights reserved.</p>
      </div>
      <a href="https://blog.naver.com/hampinim" target="_blank">
        <img src="dojang11.png" alt="도장 로고" class="stamp-logo">
      </a>
    </div>
  </footer>

</body>
</html>
