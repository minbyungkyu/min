<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>살며 사랑하며 여행하며~ | 함피 민병규</title>
  <style>
    :root {
      --primary-color: #03c75a;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #212529;
      --text-sub: #6c757d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* 헤더 영역 */
    header {
      background: #ffffff;
      padding: 30px 20px;
      border-bottom: 1px solid #e9ecef;
    }

    .header-container {
      max-width: 800px; /* 본문 max-width와 맞춰 중앙 균형 유지 */
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center; /* 전체 요소를 중앙 부근으로 자연스럽게 정렬 */
      gap: 20px;
    }

    /* 메인 로고 (logo1.png) - 크기 확대 및 위치 조정 */
    .main-logo {
      height: 80px; /* 기존 45px에서 크게 확대 */
      width: auto;
      object-fit: contain;
    }

    /* 부로고 (dojang11.png) */
    .sub-logo {
      height: 40px;
      width: auto;
      vertical-align: middle;
    }

    /* 네비게이션 메인 바 */
    nav {
      background-color: #ffffff;
      border-bottom: 1px solid #e9ecef;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .menu-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      list-style: none;
    }

    .menu-container a {
      display: block;
      padding: 16px 20px;
      text-decoration: none;
      color: #495057;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .menu-container a:hover {
      color: var(--primary-color);
      background-color: #f8f9fa;
    }

    /* 메인 콘텐츠 영역 */
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .intro-card {
      background: var(--card-bg);
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
      border: 1px solid #e9ecef;
      text-align: center;
      margin-bottom: 30px;
    }

    .intro-card h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .intro-card p {
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    /* 블로그 바로가기 버튼 */
    .btn-main {
      display: inline-block;
      padding: 12px 28px;
      background-color: var(--primary-color);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .btn-main:hover {
      background-color: #02b350;
    }

    /* 카테고리 카드 그리드 */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .category-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
      border: 1px solid #e9ecef;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      border-color: var(--primary-color);
    }

    .category-card h3 {
      font-size: 1.1rem;
      color: #333;
    }

    .category-card span {
      font-size: 0.85rem;
      color: var(--primary-color);
      margin-top: 10px;
      font-weight: bold;
    }

    /* 푸터 영역 */
    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      font-size: 0.88rem;
    }

    footer .footer-stamp {
      height: 30px;
      opacity: 0.8;
      margin-top: 10px;
    }

    /* 모바일 반응형 */
    @media (max-width: 600px) {
      .main-logo {
        height: 60px;
      }
      .menu-container a {
        padding: 12px 10px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>

  <footer>

</html>
