<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함피의 홈페이지 | 살며 사랑하며 여행하며~</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #ffffff;
            padding: 40px 20px 20px;
            text-align: center;
            border-bottom: 1px solid #e9ecef;
        }
        header h1 {
            font-size: 2rem;
            color: #212529;
            margin-bottom: 8px;
        }
        header p {
            color: #6c757d;
            font-size: 1rem;
        }
        
        /* 네비게이션 메뉴 스타일 */
        nav {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .menu-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            list-style: none;
        }
        .menu-container li {
            margin: 0;
        }
        .menu-container a {
            display: block;
            padding: 15px 18px;
            text-decoration: none;
            color: #495057;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .menu-container a:hover {
            color: #03c75a; /* 네이버 포인트 컬러 */
            background-color: #f1f3f5;
        }

        /* 메인 콘텐츠 영역 */
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .intro-card {
            background-color: #ffffff;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
        }
        .intro-card h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #343a40;
        }
        .intro-card p {
            color: #6c757d;
            margin-bottom: 25px;
        }
        .btn-main {
            display: inline-block;
            padding: 12px 24px;
            background-color: #03c75a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }
        .btn-main:hover {
            background-color: #02b350;
        }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <header>
        <h1>살며 사랑하며 여행하며~</h1>
        <p>함피 민병규의 개인 홈페이지</p>
    </header>

    <!-- 블로그 카테고리 메뉴 영역 -->
    <nav>
        <ul class="menu-container">
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim" target="_blank">전체보기</a></li>
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&categoryNo=46" target="_blank">22~현재 다낭</a></li>
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&categoryNo=44" target="_blank">2022 태국북부</a></li>
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&categoryNo=19" target="_blank">여행단상</a></li>
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&categoryNo=7" target="_blank">홍대성산망원</a></li>
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&categoryNo=16" target="_blank">주절주절</a></li>
            <li><a href="https://blog.naver.com/guestbook/GuestBookList.naver?blogId=hampinim" target="_blank">안부게시판</a></li>
        </ul>
    </nav>

    <!-- 메인 본문 영역 -->
    <main>
        <div class="intro-card">
            <h2>반갑습니다!</h2>
            <p>상단 메뉴를 클릭하시면 해당 카테고리의 네이버 블로그 글 목록으로 이동합니다.</p>
            <a href="https://blog.naver.com/hampinim" target="_blank" class="btn-main">네이버 블로그 메인 바로가기</a>
        </div>
    </main>

</body>
</html>
