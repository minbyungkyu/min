<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행은 언제나 거기 있다</title>
  <style>
    :root {
      --primary-color: #03c75a;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --nav-bg: #1e293b;
      --nav-hover: #334155;
      --accent-color: #38bdf8;
      --header-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* --------------------------------------------------
       1. 헤더 기본 스타일 (지구여행 메뉴와 시작 위치 정렬)
    -------------------------------------------------- */
    header {
      width: 100%;
      background-color: var(--header-bg);
      padding: 15px 0;
    }

    .header-container {
      max-width: 1200px; /* nav-container와 동일한 전체 폭 */
      margin: 0 auto;    /* 화면 가운데 정렬 */
      padding: 0 20px;   /* 좌우 동일 기본 여백 */
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
    }

    /* 좌측 그룹: 메인 로고 + 문구 */
    .logo-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .main-logo {
      height: 50px;
      width: auto;
      object-fit: contain;
    }

    .stamp-logo {
      height: 45px;
      width: auto;
      object-fit: contain;
    }

    /* --------------------------------------------------
       2. 네비게이션 메인 메뉴
    -------------------------------------------------- */
    nav {
      background-color: var(--nav-bg);
      width: 100%;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .main-menu {
      display: flex;
      list-style: none;
      flex-wrap: wrap;
    }

    .main-menu > li {
      position: relative;
    }

    .main-menu > li > a {
      display: block;
      padding: 14px 18px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .main-menu > li:hover > a {
      background-color: var(--nav-hover);
      color: var(--accent-color);
    }

    /* 드롭다운 서브메뉴 */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: var(--nav-bg);
      min-width: 160px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      list-style: none;
      z-index: 100;
    }

    .main-menu > li:hover .dropdown-menu {
      display: block;
    }

    .dropdown-menu li a {
      display: block;
      padding: 10px 15px;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 0.88rem;
    }

    .dropdown-menu li a:hover {
      background-color: var(--nav-hover);
      color: #ffffff;
    }

    /* --------------------------------------------------
       3. 메인 대문(Hero) 영역 (문구 위치 정렬)
    -------------------------------------------------- */
    .hero-section {
      position: relative;
      min-height: 500px;
      background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4)), url('hero1122.jpg') center 10% / cover no-repeat;
      display: flex;
      align-items: center;
      color: #ffffff;
      padding: 60px 0;
    }

    .hero-container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 20px; /* 지구여행 메뉴와 동일 기준선 */
      box-sizing: border-box;
    }

    .hero-content {
      margin-left: 0; /* 지구여행 메뉴 시작선과 완벽 일치 */
      max-width: 700px;
      text-align: left;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .hero-content strong {
      font-size: 2.2rem;
      display: inline-block;
      margin-bottom: 15px;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      line-height: 1.8;
      opacity: 0.95;
    }

    /* --------------------------------------------------
       4. 모바일 반응형 스타일 (768px 이하)
    -------------------------------------------------- */
    @media (max-width: 768px) {
      header {
        padding: 10px 0;
      }

      .header-container {
        padding: 0 15px;
      }

      .logo-group {
        gap: 8px;
      }

      /* 모바일 로고 잘림 방지 (크기 강제 축소) */
      .main-logo {
        height: 28px !important;
        max-width: 120px;
        object-fit: contain;
      }

      .stamp-logo {
        height: 28px !important;
        object-fit: contain;
      }

      .hero-section {
        min-height: 380px;
        padding: 40px 0;
      }

      .hero-container {
        padding: 0 15px;
      }

      .hero-content strong {
        font-size: 1.5rem;
      }

      .hero-subtitle {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- 헤더 영역 -->
  <header>
    <div class="header-container">
      <div class="logo-group">
        <a href="#"><img src="logo1.png" alt="메인 로고" class="main-logo"></a>
      </div>
      <img src="dojang11.png" alt="도장 로고" class="stamp-logo">
    </div>
  </header>

  <!-- 네비게이션 영역 -->
  <nav>
    <div class="nav-container">
      <ul class="main-menu">
        <li>
          <a href="#">지구여행</a>
          <ul class="dropdown-menu">
            <li><a href="#">아시아</a></li>
            <li><a href="#">유럽</a></li>
            <li><a href="#">미주</a></li>
          </ul>
        </li>
        <li><a href="#">팔도유람</a></li>
        <li><a href="#">여행단상</a></li>
        <li><a href="#">주절주절</a></li>
        <li><a href="#">읽고보고</a></li>
        <li><a href="#">홍대성산망원</a></li>
        <li><a href="#">톡톡이야기방</a></li>
        <li><a href="#">GrapeGardenHouse</a></li>
        <li><a href="#">인도엿보기</a></li>
      </ul>
    </div>
  </nav>

  <!-- 대문 영역 -->
  <section class="hero-section">
    <div class="hero-container">
      <div class="hero-content">
        <strong>여행은 언제나 거기 있다</strong><br>
        <p class="hero-subtitle">
          일상의 소음이 잠시 멀어지고,<br>
          낯선 거리의 공기가 폐 속으로 스며드는 순간<br>
          길 위에서 만나는 모든 풍경은 기록이 됩니다.
        </p>
      </div>
    </div>
  </section>

</body>
</html>
