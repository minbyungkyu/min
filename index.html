<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>살며 사랑하며 여행하며~ | 함피 민병규</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        /* 로고 헤더 영역 */
        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            padding: 60px 20px 45px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .logo-container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 로고 메인 타이틀 */
        .logo-title {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* 서브 태그라인 / 뱃지 */
        .logo-badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* 내비게이션 카테고리 메뉴 */
        nav {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .menu-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            list-style: none;
        }
        .menu-container a {
            display: block;
            padding: 16px 20px;
            text-decoration: none;
            color: #495057;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .menu-container a:hover {
            color: #03c75a;
            background-color: #f8f9fa;
        }

        /* 메인 콘텐츠 영역 */
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .intro-card {
            background-color: #ffffff;
            padding: 45px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
        }
        .intro-card h2 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            color: #212529;
        }
        .intro-card p {
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 1.05rem;
        }
        .btn-main {
            display: inline-block;
            padding: 12px 28px;
            background-color: #03c75a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }
        .btn-main:hover {
            background-color: #02b350;
        }

        @media (max-width: 600px) {
            .logo-title { font-size: 1.75rem; }
            .menu-container a { padding: 12px 14px; font-size: 0.88rem; }
        }
    </style>
</head>
<body>

    <!-- 로고 헤더 영역 -->
    <header>
        <div class="logo-container">
            <h1 class="logo-title">살며 사랑하며 여행하며~</h1>
            <div class="logo-badge">함피 민병규의 개인 공간</div>
        </div>
    </header>

    <!-- 네이버 블로그 카테고리 메뉴 -->
    <nav>
        <ul class="menu-container">
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim" target="_blank">전체보기</a></li>
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&categoryNo=46" target="_blank">22~현재 다낭</a></li>
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&categoryNo=44" target="_blank">2022 태국북부</a></li>
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&categoryNo=19" target="_blank">여행단상</a></li>
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&categoryNo=7" target="_blank">홍대성산망원</a></li>
            <li><a href="https://blog.naver.com/PostList.naver?blogId=hampinim&categoryNo=16" target="_blank">주절주절</a></li>
            <li><a href="https://blog.naver.com/guestbook/GuestBookList.naver?blogId=hampinim" target="_blank">안부게시판</a></li>
        </ul>
    </nav>

    <!-- 메인 본문 카드 -->
    <main>
        <div class="intro-card">
            <h2>반갑습니다!</h2>
            <p>상단 메뉴를 클릭하시면 해당 카테고리의 네이버 블로그 글 목록으로 이동합니다.</p>
            <a href="https://blog.naver.com/hampinim" target="_blank" class="btn-main">네이버 블로그 메인 방문하기</a>
        </div>
    </main>

</body>
</html>
