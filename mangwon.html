<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍대성산망원 | 함피 민병규</title>
    <meta name="description" content="골목길 소소한 일상, 망원동과 성산동, 홍대 인근의 풍경과 이야기. 함피 민병규의 동네 기록.">
    <link rel="icon" href="favicon.png">
    
    <!-- 서체 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #03c75a;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --nav-bg: #1e293b;
            --nav-hover: #334155;
            --accent-color: #38bdf8;
            --theme-green: #1c3d32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 1. 상단 로고 헤더 */
        header {
            background: #ffffff;
            padding: 15px 24px;
            border-bottom: 1px solid #e2e8f0;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-logo {
            height: 130px;
            width: auto;
            object-fit: contain;
        }

        .stamp-logo {
            height: 110px;
            width: auto;
            object-fit: contain;
        }

        /* 2. 네비게이션 메인 바 */
        nav {
            background-color: var(--nav-bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .main-menu {
            display: flex;
            list-style: none;
            flex-wrap: wrap;
        }

        .main-menu > li {
            position: relative;
        }

        .main-menu > li > a {
            display: block;
            padding: 16px 20px;
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.3s, color 0.3s;
        }

        .main-menu > li:hover > a,
        .main-menu > li.active > a {
            background-color: var(--nav-hover);
            color: var(--accent-color);
        }

        /* 3. 홍대성산망원 전용 히어로 영역 */
        .travel-hero-container {
            position: relative;
            width: 100%;
            min-height: calc(100vh - 200px);
            /* 감성적인 도시 골목길 및 동네 풍경 이미지 */
            background: url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=2000&q=85') center center / cover no-repeat;
            display: flex;
            align-items: center;
        }

        .travel-hero-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.78) 45%, rgba(255,255,255,0.1) 80%);
            z-index: 1;
        }

        .hero-inner {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .hero-content-box {
            max-width: 580px;
        }

        .main-title {
            font-family: 'Pretendard', -apple-system, sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--theme-green);
            letter-spacing: -1px;
            line-height: 1.25;
            margin-bottom: 8px;
        }

        .sub-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #2c4c3e;
            letter-spacing: 0.5px;
            margin-bottom: 36px;
        }

        .description-text {
            font-size: 17px;
            color: #2d3748;
            line-height: 1.85;
            word-break: keep-all;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .btn-more {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background-color: var(--theme-green);
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border-radius: 4px;
            transition: background-color 0.25s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(28, 61, 50, 0.2);
        }

        .btn-more:hover {
            background-color: #122821;
            transform: translateY(-2px);
        }

        .keywords-list {
            margin-top: 24px;
            font-size: 15px;
            color: #4a5568;
            font-weight: 500;
        }

        /* 4. 푸터 */
        footer {
            background-color: #0f172a;
            color: #94a3b8;
            padding: 35px 20px;
            margin-top: auto;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .travel-hero-container::before {
                background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.85) 60%, rgba(255,255,255,0.3) 100%);
            }
            .main-title { font-size: 40px; }
            .sub-title { font-size: 16px; letter-spacing: 4px; margin-bottom: 24px; }
            .description-text { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- 상단 로고 헤더 -->
    <header>
        <div class="header-container">
            <a href="index.html"><img src="logo1.png" alt="메인 로고" class="main-logo"></a>
            <a href="index.html"><img src="dojang11.png" alt="도장 로고" class="stamp-logo"></a>
        </div>
    </header>

    <!-- 상단 네비게이션 메뉴 -->
    <nav>
        <div class="nav-container">
            <ul class="main-menu">
                <li><a href="global_travel.html">지구여행</a></li>
                <li><a href="domestic.html">팔도유람</a></li>
                <li><a href="notes.html">여행단상</a></li>
                <li><a href="jottings.html">주절주절</a></li>
                <li><a href="reviews.html">읽고보고</a></li>
                <li><a href="mangwon.html">홍대성산망원</a></li>
                <li><a href="talktalk.html">톡톡이야기</a></li>
                <li><a href="indiascent.html">인도엿보기(2008)</a></li>
            </ul>
        </div>
    </nav>

    <!-- 홍대성산망원 오버레이 섹션 -->
    <main class="travel-hero-container">
        <div class="hero-inner">
            <div class="hero-content-box">
                <h1 class="main-title">홍대성산망원</h1>
                <div class="sub-title">MANGWON & LOCAL</div>
                <p class="description-text">
                    망원동 정겨운 골목길과 성산동의 고요함,<br>
                    홍대의 활기가 어우러지는 터전.<br>
                    발길 닿는 동네 카페, 맛있는 이야기,<br>
                    소소하지만 따뜻한 이웃과 삶의 풍경들.
                </p>
                <div>
                    <a href="https://blog.naver.com/PostList.naver?blogId=hampinim&from=postList&categoryNo=7" target="_blank" class="btn-more">
                        더보기 &rarr;
                    </a>
                </div>
                <div class="keywords-list">
                    망원동 골목 · 성산동 산책 · 동네 정보 · 소소한 일상
                </div>
            </div>
        </div>
    </main>

    <!-- 하단 푸터 -->
    <footer>
        <div class="footer-container">
            <div class="footer-info">
                <p>© KoreaHostel All rights reserved.</p>
            </div>
            <a href="https://blog.naver.com/hampinim" target="_blank">
                <img src="dojang11.png" alt="도장 로고" class="stamp-logo">
            </a>
        </div>
    </footer>

</body>
</html>
