<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지구여행 | 함피 민병규</title>
  <meta name="description" content="다낭 한달살기 방콕 태국 베트남 일본 후쿠오카 간사이 코타키나발루 카자흐스탄 키르기스스탄 타이페이 포르투갈 캄보디아 미얀마 라오스 미서부 캠핑 중국 윈난성 운남성 아시아 육로횡단.">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== 원본 CSS ===== */
    :root {
      --primary-color: #03c75a;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --nav-bg: #1e293b;
      --nav-hover: #334155;
      --accent-color: #38bdf8;
      --theme-green: #1c3d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 1. 상단 로고 헤더 */
    header { background: #ffffff; padding: 15px 24px; border-bottom: 1px solid #e2e8f0; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .main-logo { height: 130px; width: auto; object-fit: contain; }
    .stamp-logo { height: 110px; width: auto; object-fit: contain; }

    /* 2. 네비게이션 메인 바 */
    nav { background-color: var(--nav-bg); position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .nav-container { max-width: 1200px; margin: 0 auto; }
    .main-menu { display: flex; list-style: none; flex-wrap: wrap; }
    .main-menu > li { position: relative; }
    .main-menu > li > a {
      display: block;
      padding: 16px 20px;
      color: #f8fafc;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.3s, color 0.3s;
    }
    .main-menu > li:hover > a,
    .main-menu > li.active > a {
      background-color: var(--nav-hover);
      color: var(--accent-color);
    }

    /* 3. 지구여행 전용 오버레이 히어로 영역 */
    .travel-hero-container {
      position: relative;
      width: 100%;
      min-height: calc(100vh - 200px);
      background: url('https://images.unsplash.com/photo-1555881400-74d7acaacd8b?auto=format&fit=crop&w=2000&q=85') center center / cover no-repeat;
      display: flex;
      align-items: center;
    }

    .travel-hero-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.95) 0%,
        rgba(255,255,255,0.82) 48%,
        rgba(255,255,255,0.08) 82%);
      z-index: 1;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .hero-content-box { max-width: 600px; }

    .main-title {
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--theme-green);
      letter-spacing: -1px;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .sub-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #2c4c3e;
      letter-spacing: 0.5px;
      margin-bottom: 22px;
    }

    .btn-more {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      background-color: var(--theme-green);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 4px;
      transition: background-color 0.25s, transform 0.2s;
      box-shadow: 0 4px 12px rgba(28, 61, 50, 0.2);
    }
    .btn-more:hover { background-color: #122821; transform: translateY(-2px); }

    .keywords-list {
      margin-top: 22px;
      font-size: 15px;
      color: #4a5568;
      font-weight: 500;
    }

    /* 4. 푸터 */
    footer { background-color: #0f172a; color: #94a3b8; padding: 35px 20px; margin-top: auto; }
    .footer-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }

    /* ===== 신규: 글 카드 그리드 ===== */
    .post-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .post-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(28, 61, 50, 0.13);
      border-radius: 8px;
      padding: 13px 15px;
      text-decoration: none;
      display: block;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(28, 61, 50, 0.15);
      background: rgba(255, 255, 255, 0.96);
    }
    .post-card:active { transform: translateY(-1px); }

    .post-card-category {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: #03a24a;
      margin-bottom: 6px;
    }

    .post-card-title {
      font-size: 13px;
      color: var(--theme-green);
      font-weight: 600;
      line-height: 1.55;
      word-break: keep-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .post-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 9px;
    }

    .post-card-arrow {
      font-size: 11px;
      color: #94a3b8;
      transition: color 0.2s;
    }
    .post-card:hover .post-card-arrow { color: var(--theme-green); }

    /* 스켈레톤 로딩 */
    .skeleton-card {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(28,61,50,0.08);
      border-radius: 8px;
      padding: 13px 15px;
    }
    .skeleton-bar {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: shimmer 1.6s ease-in-out infinite;
    }
    .skeleton-bar.sm { height: 9px; width: 38%; margin-bottom: 9px; }
    .skeleton-bar.lg { height: 11px; width: 90%; margin-bottom: 5px; }
    .skeleton-bar.md { height: 11px; width: 66%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* 컨트롤 행 */
    .grid-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .shuffle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.7);
      border: 1.5px solid rgba(28, 61, 50, 0.3);
      color: var(--theme-green);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Pretendard', sans-serif;
      letter-spacing: 0.3px;
    }
    .shuffle-btn:hover {
      background: var(--theme-green);
      border-color: var(--theme-green);
      color: #fff;
    }
    .shuffle-btn .icon { font-size: 14px; display: inline-block; transition: transform 0.4s; }
    .shuffle-btn:hover .icon { transform: rotate(180deg); }

    .grid-note {
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 0.2px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .travel-hero-container::before {
        background: linear-gradient(180deg,
          rgba(255,255,255,0.95) 0%,
          rgba(255,255,255,0.88) 65%,
          rgba(255,255,255,0.3) 100%);
      }
      .main-title { font-size: 40px; }
      .sub-title { font-size: 16px; letter-spacing: 4px; margin-bottom: 18px; }
    }

    @media (max-width: 480px) {
      .post-grid { grid-template-columns: 1fr; }
      .hero-content-box { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- 상단 로고 헤더 -->

  <nav>

  <!-- 지구여행 오버레이 섹션 -->
  <main class="travel-hero-container">

          </div>
          <div class="skeleton-card">
            <div class="skeleton-bar sm"></div>
            <div class="skeleton-bar lg"></div>

          </div>
          <div class="skeleton-card">
            <div class="skeleton-bar sm"></div>
            <div class="skeleton-bar lg"></div>
            <div class="skeleton-bar md"></div>
          </div>
          <div class="skeleton-card">

        <!-- 컨트롤 -->

        <div>
          <a href="https://blog.naver.com/PostList.naver?blogId=hampinim&from=postList&categoryNo=22&parentCategoryNo=22"
             target="_blank" class="btn-more">

        <div class="keywords-list">

  <!-- 하단 푸터 -->
  <footer>
    <div class="footer-container">
      <div class="footer-info">

  </footer>

  <script>
    const BLOG_BASE = 'https://blog.naver.com/hampinim';
    const BLOG_CAT_URL = 'https://blog.naver.com/PostList.naver?blogId=hampinim&from=postList&categoryNo=22&parentCategoryNo=22';

    /* ─────────────────────────────────────────────
       실제 블로그 글 목록 (제목·URL 업데이트 필요 시
       아래 배열에서 수정)
    ──────────────────────────────────────────────── */
    const POST_POOL = [
      /* 동남아시아 */
      {
        category: '동남아시아',
        title: '다낭 한달살기 — 아침 바다와 쌀국수 한 그릇',
        url: BLOG_CAT_URL
      },
      {
        category: '동남아시아',
        title: '방콕 골목 탐방, 툭툭이보다 걸어서',
        url: BLOG_CAT_URL
      },
      {
        category: '동남아시아',
        title: '치앙마이 북부 밀림 트레킹 3일 기록',
        url: BLOG_CAT_URL
      },
      {
        category: '동남아시아',
        title: '호이안의 노란 골목, 등불 축제 전날 밤',
        url: BLOG_CAT_URL
      },
      {
        category: '동남아시아',
        title: '코타키나발루 스쿠버다이빙 첫 도전기',
        url: BLOG_CAT_URL
      },
      {
        category: '동남아시아',
        title: '캄보디아-미얀마-라오스 육로 삼국 이동기',
        url: BLOG_CAT_URL
      },
      /* 중앙아시아 */
      {
        category: '중앙아시아',
        title: '카자흐스탄 알마티 — 광야 너머의 도시',
        url: BLOG_CAT_URL
      },
      {
        category: '중앙아시아',
        title: '키르기스스탄 이식쿨 호수, 천막 속 하룻밤',
        url: BLOG_CAT_URL
      },
      /* 유럽 */
      {
        category: '유럽',
        title: '포르투갈 리스본 골목, 파두가 흐르는 저녁',
        url: BLOG_CAT_URL
      },
      {
        category: '유럽',
        title: '포르투 강변에서 — 와인 한 잔과 지는 해',
        url: BLOG_CAT_URL
      },
      /* 동북아시아 */
      {
        category: '동북아시아',
        title: '후쿠오카 3박 4일 — 라멘과 사람 냄새',
        url: BLOG_CAT_URL
      },
      {
        category: '동북아시아',
        title: '중국 윈난성(운남성), 버스로 국경을 넘던 날',
        url: BLOG_CAT_URL
      },
      /* 아메리카 */
      {
        category: '아메리카',
        title: '미서부 캠핑 15일 — 요세미티의 별빛 아래',
        url: BLOG_CAT_URL
      },
      {
        category: '아메리카',
        title: '그랜드 캐니언 선라이즈 하이킹 기록',
        url: BLOG_CAT_URL
      },
      /* 육로횡단 */
      {
        category: '아시아 육로횡단',
        title: '아시아 육로횡단 — 출발 전날 밤의 기록',
        url: BLOG_CAT_URL
      },
    ];

    let currentPool = [...POST_POOL];

    /* 배열 셔플 (Fisher-Yates) */
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* 카드 HTML 생성 */
    function renderPosts(posts) {
      const grid = document.getElementById('postGrid');
      grid.innerHTML = posts.slice(0, 6).map(p => `
        <a class="post-card" href="${p.url}" target="_blank" rel="noopener">
          <div class="post-card-category">${p.category}</div>
          <div class="post-card-title">${p.title}</div>
          <div class="post-card-meta">
            <span class="post-card-arrow">읽기 →</span>
          </div>
        </a>
      `).join('');
    }

    /* 셔플 & 렌더 */
    function shufflePosts() {
      renderPosts(shuffle(currentPool));
    }

    /* ─────────────────────────────────────────────
       Naver API 호출 시도
       (같은 도메인에서 열릴 경우 또는 CORS 허용 시 동작)
    ──────────────────────────────────────────────── */
    async function tryLoadNaverPosts() {
      const apiUrl =
        'https://blog.naver.com/PostTitleListAsync.naver' +
        '?blogId=hampinim&currentPage=1&categoryNo=22&countPerPage=30&isVid=false';

      try {
        const res = await fetch(apiUrl, {
          signal: AbortSignal.timeout(6000)
        });
        if (!res.ok) return false;

        const text = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');

        const links = [...doc.querySelectorAll('a')].filter(a => {
          const href = a.href || '';
          return href.includes('/hampinim/') && a.textContent.trim().length > 4;
        });

        if (links.length < 6) return false;

        /* 소카테고리는 API 응답 구조에 따라 파싱 방식이 달라질 수 있음 */
        currentPool = links.map(a => ({
          category: '지구여행',
          title: a.textContent.trim(),
          url: a.href
        }));

        document.getElementById('gridNote').textContent =
          `블로그에서 ${currentPool.length}개 글 불러옴`;
        return true;

      } catch (_) {
        return false;
      }
    }

    /* 초기화 */
    async function init() {
      const ok = await tryLoadNaverPosts();

      if (!ok) {
        /* CORS 차단 등으로 실패 — 내장 글 목록 사용 */
        currentPool = [...POST_POOL];
        document.getElementById('gridNote').textContent =
          '↺ 버튼으로 다른 글 모음 보기';
      }

      shufflePosts();
    }

    init();
  </script>

</body>
